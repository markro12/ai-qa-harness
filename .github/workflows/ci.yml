name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly regression: 16:00 UTC is 03:00 in Melbourne (AEDT).
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.idp }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # keycloak: the real identity provider. mock: the built-in stand-in, as a fallback signal.
        idp: [keycloak, mock]
    env:
      CI: "true"
      IDP: ${{ matrix.idp }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Start Keycloak
        if: matrix.idp == 'keycloak'
        run: |
          docker compose up -d keycloak
          echo "Waiting for the demo realm..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/realms/demo/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak is ready."; exit 0
            fi
            sleep 3
          done
          echo "Keycloak did not start in time."; docker compose logs keycloak; exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test

      - name: Keycloak logs on failure
        if: failure() && matrix.idp == 'keycloak'
        run: docker compose logs keycloak | tail -200

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.idp }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
